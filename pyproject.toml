[project]
name = "etfsys"
version = "0.1.0"
description = "Multi-strategy ETF research and backtest platform"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["yfinance", "fredapi", "pyarrow", "duckdb", "pandera", "python-dotenv"]
notebooks = ["jupyterlab", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["etfsys*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
